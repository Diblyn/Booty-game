<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booty - Platform Puzzle Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        canvas {
            border: 3px solid #4a9eff;
            background: #0a0a0a;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .ui {
            display: flex;
            gap: 40px;
            font-size: 18px;
            align-items: center;
        }

        .level-info {
            background: #2a2a2a;
            padding: 10px 20px;
            border: 2px solid #4a9eff;
        }

        .controls {
            text-align: center;
            font-size: 14px;
            color: #888;
        }

        .controls p {
            margin: 5px 0;
        }

        .message {
            font-size: 20px;
            color: #4a9eff;
            text-align: center;
            min-height: 30px;
        }

        .stats {
            display: flex;
            gap: 20px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #4a9eff;
            color: #000;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
            transition: all 0.2s;
        }

        button:hover {
            background: #6ab8ff;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="color: #4a9eff;">🎮 BOOTY</h1>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="ui">
            <div class="level-info">Level: <span id="levelNum">1</span>/10</div>
            <div class="stats">
                <div>Jumps: <span id="jumpCount">0</span></div>
                <div>Time: <span id="timeCount">0</span>s</div>
            </div>
        </div>
        <div class="message" id="message"></div>
        <button id="restartBtn">Restart Level</button>
        <div class="controls">
            <p>↑ SPACE / W — Jump</p>
            <p>← → / A D — Move</p>
            <p>Reach the exit ⭐ to complete the level</p>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
