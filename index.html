<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BOOTY - Pirate Platform Puzzle</title>
<meta name="description" content="Remake web del clásico de 1984: 20 bodegas conectadas, 125 piezas de botín, llaves numeradas, ascensores y piratas.">
<style>
  @font-face { font-family: 'Press Start 2P'; src: url('fonts/PressStart2P.woff2') format('woff2'); font-display: block; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; touch-action: none; -webkit-user-select: none; user-select: none; }
  #screen { display: block; image-rendering: pixelated; image-rendering: crisp-edges; box-shadow: 0 0 0 4px #111, 0 0 40px rgba(0,120,255,.25); }
  #touch { position: fixed; inset: auto 0 0 0; display: none; justify-content: space-between; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); pointer-events: none; }
  #touch .pad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(2, 56px); gap: 6px; pointer-events: auto; }
  #touch button { font: 12px 'Press Start 2P', monospace; color: #fff; background: rgba(0,0,215,.45); border: 2px solid rgba(0,215,215,.8); border-radius: 10px; touch-action: none; }
  #touch button.on { background: rgba(0,215,215,.7); }
  #touch .jump { width: 84px; height: 84px; border-radius: 50%; align-self: end; pointer-events: auto; background: rgba(215,0,0,.5); border-color: rgba(255,255,0,.8); }
  @media (pointer: coarse) { #touch { display: flex; } }
</style>
</head>
<body>
<canvas id="screen" width="768" height="576" aria-label="Booty game screen"></canvas>
<div id="touch">
  <div class="pad">
    <button data-k="map">MAP</button><button data-k="up">&#9650;</button><button data-k="pause">II</button>
    <button data-k="left">&#9664;</button><button data-k="down">&#9660;</button><button data-k="right">&#9654;</button>
  </div>
  <button class="jump" data-k="jump">JUMP</button>
</div>
<script src="levels.js"></script>
<script src="engine.js"></script>
<script src="game.js"></script>
</body>
</html>
