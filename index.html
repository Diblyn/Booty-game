<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOTY - Pirate Platform Puzzle</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Press Start 2P', monospace;
            background: #0c0c1d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 800px;
            padding: 8px 12px;
            background: #1a0a2e;
            border: 2px solid #c9a033;
            border-bottom: none;
        }

        .header .title {
            font-size: 20px;
            color: #c9a033;
            text-shadow: 2px 2px #000;
            letter-spacing: 4px;
        }

        .header .stats {
            display: flex;
            gap: 20px;
            font-size: 10px;
            margin-left: auto;
            color: #aaa;
        }

        .header .stats span {
            color: #c9a033;
        }

        canvas {
            display: block;
            border: 2px solid #c9a033;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 800px;
            padding: 8px 12px;
            background: #1a0a2e;
            border: 2px solid #c9a033;
            border-top: none;
        }

        .footer .level-name {
            font-size: 10px;
            color: #7ec8e3;
        }

        .footer .controls-hint {
            font-size: 8px;
            color: #555;
        }

        .message-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: #c9a033;
            text-shadow: 2px 2px #000, -1px -1px #000;
            pointer-events: none;
            z-index: 10;
            text-align: center;
            line-height: 2;
            display: none;
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="header">
            <div class="title">☠ BOOTY</div>
            <div class="stats">
                <div>LVL <span id="levelNum">1</span>/10</div>
                <div>COINS <span id="coinCount">0</span></div>
                <div>TIME <span id="timeCount">0</span></div>
            </div>
        </div>
        <canvas id="gameCanvas" width="800" height="560"></canvas>
        <div class="footer">
            <div class="level-name" id="levelName">THE LOWER DECK</div>
            <div class="controls-hint">WASD/ARROWS MOVE · SPACE JUMP · R RESTART</div>
        </div>
    </div>
    <div class="message-overlay" id="message"></div>
    <script src="game.js"></script>
</body>
</html>
